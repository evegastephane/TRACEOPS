<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACEOPS — Prototype des interventions</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172634;background:#f3f5f8;line-height:1.5;--ink:#172634;--muted:#526478;--line:#dbe2ea;--blue:#2259d5;--nav:#152d44}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px 16px;font-weight:650;min-height:44px}button:hover{background:#edf2fa}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.primary:hover{background:#1948b1}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #d98920;outline-offset:3px}input,select,textarea{border:1px solid #91a2b5;border-radius:7px;padding:11px;background:white;color:var(--ink);width:100%;caret-color:var(--blue)}textarea{min-height:95px;resize:vertical}label{display:grid;gap:7px;font-size:.9rem;font-weight:650}small,.muted{color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(1.7rem,3vw,2.3rem);letter-spacing:-.03em;line-height:1.2;margin-bottom:12px}h2{font-size:1.15rem;margin-bottom:16px}h3{font-size:1rem}p{max-width:68ch}a{color:var(--blue);text-underline-offset:3px}::selection{background:#cbdcfc}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#a9b7c9;border:2px solid #f3f5f8;border-radius:8px}.lab{background:#fff3d9;color:#5a3d05;padding:10px 24px;display:flex;gap:16px;justify-content:space-between;align-items:center;font-size:.8rem;flex-wrap:wrap}.lab button{font-size:.8rem;padding:5px 12px;min-height:36px;background:transparent;border-color:#bc995e}.top{background:white;border-bottom:1px solid var(--line);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:20px}.logo{font-size:1.3rem;font-weight:800;letter-spacing:.035em}.logo span{font-weight:400;color:#526478}.role{white-space:nowrap;display:flex;align-items:center;gap:12px;font-size:.85rem}.role select{max-width:240px;padding:8px 12px}.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 130px)}aside{background:var(--nav);color:white;padding:28px 16px;display:flex;flex-direction:column;gap:24px}.org{padding:0 12px}.org strong{display:block;font-size:.9rem}.org small{color:#b6cadc}.nav{display:grid;gap:5px}.nav button{text-align:left;background:transparent;color:#c8d8e6;border:0;font-size:.9rem;padding:12px 16px}.nav button:hover{background:#284359}.nav button[aria-current=page]{background:#e8f0ff;color:#183b81}.aside-foot{margin-top:auto;font-size:.8rem;color:#b6cadc;padding:12px}main{padding:36px 40px;max-width:1400px;width:100%;min-width:0}.heading{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:28px}.heading p{color:var(--muted);margin-bottom:0}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:22px}.columns{align-items:start;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px}.aside-panel{background:#eaf0f8;padding:22px;border-radius:12px;align-self:start}.aside-panel p{font-size:.9rem;color:#415670}.aside-panel ol{padding-left:20px;font-size:.9rem}.aside-panel li{margin:12px 0}.badge{display:inline-block;border-radius:5px;padding:4px 9px;background:#e8effb;color:#244989;font-size:.78rem;font-weight:650;white-space:nowrap}.badge.review{background:#fff0cc;color:#775000}.badge.validated{background:#dff2e7;color:#21613b}.badge.rework{background:#ffebe3;color:#9a3a17}.list{list-style:none;margin:0;padding:0}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}.row:first-child{padding-top:0}.row:last-child{border:0;padding-bottom:0}.row p{margin:5px 0;color:var(--muted);font-size:.9rem}.row strong{display:block;font-size:1rem}.row .actions{justify-content:flex-end}.section-label{display:flex;align-items:center;gap:12px}.count{font-size:.8rem;font-weight:500;color:#526478}.summary{display:flex;gap:22px;flex-wrap:wrap;font-size:.85rem;padding:16px 0 22px}.summary strong{display:block;margin-top:3px;color:var(--ink)}.summary>div{color:var(--muted)}.progress{list-style:none;display:flex;padding:0;margin:0 0 28px;gap:8px;flex-wrap:wrap}.progress li{font-size:.8rem;padding:8px 14px;background:#e5eaf0;border-radius:5px;color:#526478}.progress li.current{background:#dce7ff;color:#173d8d;font-weight:700}.form{max-width:740px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form label{margin-bottom:20px}.full{grid-column:1/-1}.checks{display:grid;gap:12px}.check{display:flex;align-items:start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:8px;font-size:.95rem}.check input{width:20px;height:20px;flex:0 0 auto;margin-top:3px;accent-color:var(--blue)}.check span{display:block}.check small{display:block;font-weight:400}.note{padding:14px 18px;background:#e9f0fd;color:#234778;border-radius:8px;margin-bottom:22px;font-size:.9rem}.error{background:#ffebe8;color:#8b2a21;padding:14px;border-radius:8px;margin:16px 0}.success{background:#e1f2e8;color:#245438;padding:14px 18px;border-radius:8px;margin-bottom:20px}.empty{padding:38px 12px;text-align:center}.empty p{margin:10px auto 20px;color:var(--muted)}.task{padding:22px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task h3{margin-bottom:6px}.proofs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.proof{border:1px dashed #7e94af;padding:12px 16px;border-radius:7px;background:#f8fafc;font-size:.85rem}.history{list-style:none;padding:0}.history li{padding:12px 0;border-bottom:1px solid var(--line);font-size:.9rem}.history small{display:block}.back{margin-bottom:22px}.toolbar{display:flex;gap:14px;align-items:end;margin-bottom:22px}.toolbar label{flex:1;max-width:460px}.footer-action{margin-top:24px;display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}details{margin:16px 0}summary{cursor:pointer;font-weight:650;padding:10px 0}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}.divider{border-top:1px solid var(--line);margin:24px 0}.notice{outline:none}.title-focus:focus{outline:none}@media(max-width:1050px){main{padding:28px 24px}.columns{grid-template-columns:1fr}.aside-panel{order:2}.shell{grid-template-columns:190px minmax(0,1fr)}}@media(max-width:700px){.lab{padding:10px 16px;gap:8px}.top{height:auto;min-height:80px;padding:16px;flex-wrap:wrap}.role{width:100%;justify-content:space-between}.role select{max-width:220px}.shell{display:block}aside{padding:14px 16px;gap:12px}.org,.aside-foot{display:none}.nav{display:flex;gap:6px;overflow-x:auto}.nav button{white-space:nowrap;padding:10px 12px;flex-shrink:0}main{padding:26px 16px}.heading{display:block}.heading>.actions{margin-top:20px}.panel{padding:20px}.row{align-items:start;flex-direction:column}.row .actions{width:100%;justify-content:space-between}.form-grid{display:block}.summary{gap:18px}.footer-action{justify-content:stretch}.footer-action button{flex:1}.toolbar{align-items:stretch;flex-direction:column}.progress li{padding:7px 10px}.heading h1{overflow-wrap:anywhere}}@media(prefers-reduced-motion:no-preference){main{animation:arrive .16s ease-out}@keyframes arrive{from{transform:translateY(4px)}to{transform:translateY(0)}}
</style></head><body>
<div class="lab"><span><strong>Prototype UX</strong> · Données fictives · Aucun accès à votre base · Les essais disparaissent à la fermeture/recharge</span><button id="reset">Recommencer l’essai</button></div>
<header class="top"><div class="logo">TRACE<span>OPS</span></div><label class="role">Tester la vue <select id="role"><option value="client">Responsable client</option><option value="provider">Responsable prestataire</option><option value="agent">Agent responsable</option><option value="controller">Contrôleur client</option><option value="admin">Administrateur</option></select></label></header>
<div class="shell"><aside><div class="org"><strong id="organization"></strong><small>Espace de démonstration</small></div><nav class="nav" aria-label="Navigation principale" id="nav"></nav><div class="aside-foot">Une intervention.<br>Des responsabilités claires.</div></aside><main id="main"></main></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roles={client:'Responsable client',provider:'Responsable prestataire',agent:'Agent responsable',controller:'Contrôleur client',admin:'Administrateur'};
const status={planned:'À affecter',assigned:'Planifiée',progress:'En cours',review:'À contrôler',rework:'Reprise demandée',validated:'Validée'};
const menus={client:[['home','À traiter'],['all','Interventions'],['sites','Sites']],provider:[['home','À affecter'],['all','Interventions'],['team','Agents']],agent:[['home','Aujourd’hui'],['all','Mes interventions']],controller:[['home','À contrôler'],['all','Historique']],admin:[['home','Organisations'],['audit','Journal d’audit']]};
let role='client',view='home',selected=null,notice='',step=0,draft={},dirty=false;let items=[];let audit=[];
function initial(){items=[{id:'INT-014',title:'Nettoyage de la salle 101',room:'Salle 101',date:'2026-11-05',start:'09:00',end:'10:00',state:'planned',agents:[],lead:'',tasks:[{name:'Nettoyer le sol',done:false,before:false,after:false},{name:'Nettoyer les surfaces',done:false,before:false,after:false}],version:0,rework:[],reason:'',anomaly:'',closed:false,events:[]}];audit=[];}
initial();
function event(item,text){const e={text,actor:roles[role],time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};item.events.unshift(e);audit.unshift({...e,id:item.id});}
function badge(i){return `<span class="badge ${i.state}">${status[i.state]}</span>`;}
function action(a,text,cls='',id=''){return `<button class="${cls}" data-action="${a}" ${id?`data-id="${id}"`:''}>${text}</button>`;}
function heading(title,sub,buttons=''){return `<div class="heading"><div><h1 class="title-focus" tabindex="-1">${title}</h1><p>${sub}</p></div><div class="actions">${buttons}</div></div>`;}
function applicable(i){return role!=='agent'||i.agents.includes('Agent A');}
function relevant(i){return role==='client'?['planned','assigned','progress','rework'].includes(i.state):role==='provider'?i.state==='planned':role==='agent'?['assigned','progress','rework'].includes(i.state)&&applicable(i):i.state==='review';}
function nextHint(i){return ({planned:'Le prestataire doit affecter les agents.',assigned:'L’agent responsable peut démarrer.',progress:'Les agents renseignent le compte rendu.',review:'Le contrôleur du client doit examiner les preuves.',rework:'Les tâches signalées doivent être corrigées.',validated:'Le compte rendu est validé. Les anomalies restent suivies séparément.'})[i.state];}
function titleFor(i){return role==='provider'&&i.state==='planned'?'Affecter les agents':role==='agent'&&['assigned','progress','rework'].includes(i.state)?'Ouvrir ma mission':role==='controller'&&i.state==='review'?'Contrôler':'Consulter';}
function rows(list){return list.length?`<ul class="list">${list.map(i=>`<li class="row"><div><strong>${esc(i.title)}</strong><p>Hôpital pilote · Bâtiment A / Étage 1 / ${esc(i.room)}</p><small>${esc(i.id)} · ${esc(i.date)} · ${i.start}–${i.end} · Heure du Cameroun</small></div><div class="actions">${badge(i)}${action('open',titleFor(i),'',i.id)}</div></li>`).join('')}</ul>`:`<div class="empty"><h2>Rien à traiter dans cette vue</h2><p>Les interventions qui attendent votre action apparaîtront ici.</p>${action('all','Voir les interventions')}</div>`;}
function home(){if(role==='admin')return heading('Organisations','Accédez au périmètre de chaque organisation.')+`<section class="panel"><ul class="list"><li class="row"><div><strong>Hôpital pilote</strong><p>Client · Site Hôpital pilote · Contrôleur habilité</p></div>${action('sites','Consulter les sites')}</li><li class="row"><div><strong>Services pilote</strong><p>Prestataire · Deux agents disponibles dans le scénario</p></div>${action('team','Consulter les agents')}</li></ul></section><p class="muted">La création d’organisations est disponible dans l’application actuelle ; ce prototype se concentre sur le parcours des interventions.</p>`;
const titles={client:'Le travail à suivre',provider:'Organisez les prochaines interventions',agent:'Votre prochaine intervention',controller:'Les comptes rendus à contrôler'};
return heading(titles[role],role==='agent'?'Scénario du 5 novembre 2026 · Vos missions affectées.':'Hôpital pilote · Les actions et responsabilités en un coup d’œil.',role==='client'?action('create','Créer une intervention','primary'):'')+`<div class="columns"><section class="panel"><h2 class="section-label">${role==='client'?'Interventions en cours de suivi':menus[role][0][1]}<span class="count">${items.filter(relevant).length}</span></h2>${rows(items.filter(relevant))}</section><section class="aside-panel"><h2>Essayez le parcours</h2><p>Changez de vue en haut pour suivre la même intervention.</p><ol><li>Client : créer le travail.</li><li>Prestataire : affecter les agents.</li><li>Agent : réaliser et soumettre.</li><li>Contrôleur : valider ou demander une reprise.</li></ol><p>Les preuves sont simulées. Aucune photo réelle n’est demandée.</p></section></div>`;}
function listing(){return heading(role==='agent'?'Mes interventions':'Interventions','Retrouvez le travail et son état, dans le périmètre de cette vue.',role==='client'?action('create','Créer une intervention','primary'):'')+`<div class="toolbar"><label>Rechercher une intervention<input id="search" type="search" placeholder="Titre, référence ou salle"></label></div><section class="panel" id="results">${rows(items.filter(applicable))}</section>`;}
function sites(){return heading('Hôpital pilote','Bâtiment A · Étape de préparation du scénario')+`<section class="panel"><h2>Lieux d’intervention</h2><details open><summary>Bâtiment A</summary><details open><summary>Étage 1</summary><ul><li>Salle 101 · SAL-101</li><li>Salle 204 · SAL-204</li></ul></details></details><div class="divider"></div><h2>Responsabilités</h2><p><strong>Prestataire rattaché :</strong> Services pilote</p><p><strong>Contrôleur habilité :</strong> Contrôleur C</p><p class="muted">Les rattachements sont préconfigurés pour cet essai.</p>${role==='client'?action('create','Créer une intervention','primary'):''}</section>`;}
function team(){return heading('Agents du prestataire','Équipe fictive utilisée pour tester l’affectation.')+`<section class="panel"><ul class="list"><li class="row"><div><strong>Agent A</strong><p>Disponible pour le scénario · Responsable de mission proposé</p></div></li><li class="row"><div><strong>Agent B</strong><p>Indisponibilité simulée : le 5 novembre, 09:30–10:30</p></div></li><li class="row"><div><strong>Agent C</strong><p>Disponible pour le scénario · Contributeur</p></div></li></ul></section>`;}
function log(){return heading('Journal d’audit simulé','Les actions de cette session, avec leur rôle et leur référence.')+`<section class="panel">${history(audit)}</section>`;}
function history(events){return events.length?`<ol class="history">${events.map(e=>`<li>${esc(e.text)}<small>${esc(e.actor)} · ${e.time}${e.id?' · '+e.id:''}</small></li>`).join('')}</ol>`:'<p class="muted">Aucune action enregistrée dans cette session de simulation.</p>';}
function create(){const names=['Lieu et créneau','Travail attendu','Vérification'];return heading('Nouvelle intervention','Définissez le travail, puis transmettez-le au prestataire.')+`<ol class="progress">${names.map((n,k)=>`<li class="${step===k?'current':''}" ${step===k?'aria-current="step"':''}>${k+1}. ${n}</li>`).join('')}</ol><section class="panel form"><form id="createForm">${step===0?`<div class="form-grid"><label class="full">Titre de l’intervention<input name="title" value="${esc(draft.title)}" required maxlength="100" placeholder="Ex. Nettoyage de la salle 204"></label><label>Site<input value="Hôpital pilote" readonly></label><label>Salle<select name="room" aria-label="Salle"><option ${draft.room==='Salle 101'?'selected':''}>Salle 101</option><option ${draft.room==='Salle 204'?'selected':''}>Salle 204</option></select></label><label>Date<input name="date" type="date" value="${draft.date||'2026-11-05'}" required></label><div></div><label>Début<input name="start" type="time" value="${draft.start||'09:00'}" required></label><label>Fin<input name="end" type="time" value="${draft.end||'10:00'}" required></label></div><p class="muted">Heure du Cameroun · Africa/Douala</p>`:step===1?`<label>Tâches à réaliser<textarea name="tasks" required maxlength="600" placeholder="Une tâche par ligne">${esc(draft.tasks||'Nettoyer le sol\nNettoyer les surfaces')}</textarea></label><p>Dans ce scénario, chaque tâche demande une preuve avant et après.</p><label>Prestataire<input value="Services pilote — rattaché au site" readonly></label>`:`<h2>${esc(draft.title)}</h2><p>Hôpital pilote / Bâtiment A / Étage 1 / ${esc(draft.room)}</p><p>${esc(draft.date)} · ${esc(draft.start)}–${esc(draft.end)}</p><h3>Travail demandé</h3><ul>${draft.tasks.split('\n').filter(x=>x.trim()).map(t=>`<li>${esc(t)}</li>`).join('')}</ul><p>Le prestataire Services pilote recevra cette intervention à affecter. Aucun agent n’est encore désigné.</p>`}<div id="formError" role="alert"></div><div class="footer-action">${step? action('previous','Précédent'):action('cancel','Annuler')}<button class="primary" type="submit">${step===2?'Transmettre au prestataire':'Continuer'}</button></div></form></section>`;}
function detail(){const i=items.find(x=>x.id===selected);if(!i||!applicable(i)){view='home';return home();}const assignment=role==='provider'&&i.state==='planned';const execution=role==='agent'&&['progress','rework'].includes(i.state);return action('all','Retour aux interventions','back')+heading(esc(i.title),`Hôpital pilote / Bâtiment A / Étage 1 / ${esc(i.room)}`,badge(i))+`<div class="summary"><div>Référence<strong>${i.id}</strong></div><div>Créneau<strong>${esc(i.date)} · ${i.start}–${i.end}</strong></div><div>Responsable<strong>${esc(i.lead||'À désigner')}</strong></div><div>Prestataire<strong>Services pilote</strong></div><div>Compte rendu<strong>${i.version?'Version '+i.version:'Pas encore soumis'}</strong></div></div><p class="note">${nextHint(i)}</p>${i.state==='rework'?`<p class="error">Reprise demandée : ${esc(i.reason)}. Le travail non concerné est conservé.</p>`:''}<div class="columns"><div><section class="panel"><h2>${assignment?'Travail à affecter':'Travail et preuves'}</h2>${i.tasks.map((t,k)=>`<article class="task"><h3>${esc(t.name)}</h3>${i.rework.includes(k)?'<span class="badge rework">À reprendre</span>':''}<p class="muted">${t.done?'Réalisée · contribution simulée Agent A':'À réaliser'}</p>${execution&&(!i.rework.length||i.rework.includes(k))?`<label class="check"><input type="checkbox" data-task="${k}" ${t.done?'checked':''}><span>Tâche réalisée</span></label><div class="proofs">${action('before',t.before?'Avant : preuve simulée ajoutée':'Ajouter une preuve avant','',String(k))}${action('after',t.after?'Après : preuve simulée ajoutée':'Ajouter une preuve après','',String(k))}</div>`:`<div class="proofs"><span class="proof">Avant : ${t.before?'preuve simulée disponible':'non fournie'}</span><span class="proof">Après : ${t.after?'preuve simulée disponible':'non fournie'}</span></div>`}</article>`).join('')}${role==='agent'&&i.state==='assigned'?`<p>Vérifiez le lieu et les consignes avant de démarrer.</p>${action('start','Démarrer l’intervention','primary')}`:''}${execution?`<p class="muted">Preuves fictives : aucun fichier n’est envoyé. Vos clics sont conservés seulement pendant cet essai.</p>${action('prepare','Vérifier et soumettre','primary')}`:''}</section>${assignment?`<section class="panel"><h2>Affecter les agents</h2><form id="assignForm"><div class="checks">${['Agent A','Agent B','Agent C'].map(a=>`<label class="check"><input type="checkbox" name="agents" value="${a}"><span>${a}<small>${a==='Agent B'?'Occupé le 5 novembre, 09:30–10:30':'Disponible dans le scénario'}</small></span></label>`).join('')}</div><label style="margin-top:20px">Responsable de mission<select name="lead"><option>Agent A</option></select></label><p class="muted">Agent A est le responsable testé dans ce prototype. Agent C peut contribuer.</p><div id="formError" role="alert"></div><div class="footer-action"><button class="primary">Confirmer l’affectation</button></div></form></section>`:''}${role==='controller'&&i.state==='review'?`<section class="panel"><h2>Décision du client</h2><p>Vérifiez chaque tâche et ses preuves avant votre décision.</p><div class="actions">${action('rework','Demander une reprise')}${action('validatePrompt','Valider l’intervention','primary')}</div></section>`:''}<section id="decision"></section>${execution?`<section class="panel"><h2>Signaler une anomalie</h2><form id="anomalyForm"><label>Décrivez le problème<textarea name="anomaly" required maxlength="400">${esc(i.anomaly)}</textarea></label><div class="footer-action"><button>Enregistrer le signalement</button></div></form></section>`:''}${i.anomaly?`<section class="panel"><h2>Anomalie ${i.closed?'clôturée':'ouverte'}</h2><p>${esc(i.anomaly)}</p>${role==='controller'&&!i.closed?action('closePrompt','Examiner la clôture'):''}<p class="muted">La validation du compte rendu ne clôture pas automatiquement cette anomalie.</p></section>`:''}</div><section class="aside-panel"><h2>Responsabilités</h2><p><strong>Équipe :</strong> ${esc(i.agents.join(', ')||'Aucune affectation')}</p><p><strong>Contrôle :</strong> Contrôleur C, habilité sur ce site.</p><h2>Historique de l’essai</h2>${history(i.events)}${i.snapshots?.length?'<h2>Versions conservées</h2>'+i.snapshots.map(v=>`<details><summary>Version ${v.version}</summary><ul>${v.tasks.map(t=>`<li>${esc(t.name)} — ${t.done?'réalisée':'incomplète'}, avant ${t.before?'présent':'absent'}, après ${t.after?'présent':'absent'} (preuves simulées)</li>`).join('')}</ul></details>`).join(''):''}</section></div>`;}
function render(focus=false){$('#organization').textContent=['provider','agent'].includes(role)?'Services pilote':role==='admin'?'Administration TRACEOPS':'Hôpital pilote';$('#nav').innerHTML=menus[role].map(([key,name])=>`<button data-action="${key}" ${view===key?'aria-current="page"':''}>${name}</button>`).join('');$('#main').innerHTML=(notice?`<div class="success notice" role="status">${esc(notice)}</div>`:'')+({home,all:listing,sites,team,audit:log,create,detail}[view]||home)();if(focus)$('#main h1')?.focus();}
function leave(){return !dirty||confirm('Abandonner cette saisie non transmise ?');}
$('#role').onchange=e=>{if(!leave()){e.target.value=role;return;}dirty=false;role=e.target.value;view='home';notice='';render(true);};
$('#reset').onclick=()=>{if(confirm('Effacer uniquement les essais de ce prototype et recommencer ?')){initial();dirty=false;notice='Essai réinitialisé.';view='home';render(true);}};
document.addEventListener('input',e=>{if(e.target.id==='search'){$('#results').innerHTML=rows(items.filter(applicable).filter(i=>(i.title+' '+i.room+' '+i.id).toLowerCase().includes(e.target.value.toLowerCase())));}else if(e.target.closest('form'))dirty=true;});
document.addEventListener('change',e=>{if(e.target.dataset.task!==undefined){const i=items.find(x=>x.id===selected);if(role==='agent'&&['progress','rework'].includes(i.state))i.tasks[Number(e.target.dataset.task)].done=e.target.checked;}});
function decision(html){$('#decision').innerHTML=`<section class="panel">${html}</section>`;$('#decision').scrollIntoView({behavior:'auto',block:'start'});$('#decision input, #decision button, #decision textarea')?.focus();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();const a=b.dataset.action,i=items.find(x=>x.id===selected);if(['home','all','sites','team','audit','open','create','cancel'].includes(a)){if(!leave())return;dirty=false;notice='';if(a==='open'){selected=b.dataset.id;view='detail';}else if(a==='create'){if(role!=='client')return;draft={};step=0;view='create';}else view=a==='cancel'?'home':a;render(true);return;}
if(a==='previous'){Object.assign(draft,Object.fromEntries(new FormData($('#createForm'))));step--;render(true);return;}if(!i)return;
if(a==='start'&&role==='agent'&&i.state==='assigned'){i.state='progress';event(i,'Intervention démarrée');notice='Intervention démarrée. Renseignez les tâches et leurs preuves.';render(true);}
if(['before','after'].includes(a)&&role==='agent'&&['progress','rework'].includes(i.state)){i.tasks[Number(b.dataset.id)][a]=true;b.textContent=(a==='before'?'Avant':'Après')+' : preuve simulée ajoutée';b.setAttribute('aria-label',b.textContent);}
if(a==='prepare'&&role==='agent'&&['progress','rework'].includes(i.state)){const missing=i.tasks.filter(t=>!t.done||!t.before||!t.after);decision(missing.length?`<h2>Le compte rendu est incomplet</h2><p role="alert">Complétez ces tâches et leurs preuves avant/après :</p><ul>${missing.map(t=>`<li>${esc(t.name)}</li>`).join('')}</ul>${action('dismiss','Revenir aux tâches')}`:`<h2>Soumettre au client ?</h2><p>${i.tasks.length} tâches complétées. Une version consultable sera transmise au Contrôleur C.</p>${i.anomaly?'<p>L’anomalie signalée restera ouverte.</p>':''}<div class="actions">${action('dismiss','Continuer la vérification')}${action('submit','Soumettre le compte rendu','primary')}</div>`);}
if(a==='submit'&&role==='agent'&&['progress','rework'].includes(i.state)&&i.tasks.every(t=>t.done&&t.before&&t.after)){i.state='review';i.version++;i.rework=[];event(i,'Compte rendu version '+i.version+' soumis');notice='Compte rendu soumis. Passez à la vue Contrôleur client pour poursuivre le test.';dirty=false;render(true);}
if(a==='rework'&&role==='controller'&&i.state==='review'){decision(`<h2>Quelles tâches doivent être reprises ?</h2><form id="reworkForm"><div class="checks">${i.tasks.map((t,k)=>`<label class="check"><input type="checkbox" name="tasks" value="${k}"><span>${esc(t.name)}</span></label>`).join('')}</div><label style="margin-top:20px">Motif de reprise<textarea name="reason" required maxlength="400"></textarea></label><div id="formError" role="alert"></div><div class="footer-action">${action('dismiss','Annuler')}<button class="primary">Envoyer la demande de reprise</button></div></form>`);}
if(a==='validatePrompt'&&role==='controller'&&i.state==='review'){decision(`<h2>Confirmer la validation ?</h2><p>Vous validez la version ${i.version} de ${esc(i.title)}.</p><form id="validateForm">${i.anomaly&&!i.closed?'<label>Motif de validation avec réserve<textarea name="reserve" required maxlength="400"></textarea></label><p>L’anomalie restera ouverte.</p>':''}<div class="footer-action">${action('dismiss','Revenir au contrôle')}<button class="primary">Confirmer la validation</button></div></form>`);}
if(a==='closePrompt'&&role==='controller'&&i.anomaly&&!i.closed){decision('<h2>Clôturer l’anomalie</h2><form id="closeForm"><label>Constat de résolution<textarea name="resolution" required maxlength="400"></textarea></label><div class="footer-action">'+action('dismiss','Annuler')+'<button class="primary">Confirmer la clôture</button></div></form>');}
if(a==='dismiss'){if(!leave())return;dirty=false;$('#decision').innerHTML='';$('#main h1')?.focus();}});
function fail(message){$('#formError').innerHTML=`<p class="error">${esc(message)}</p>`;}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),i=items.find(x=>x.id===selected);
if(f.id==='createForm'){Object.assign(draft,Object.fromEntries(d));if(step===0&&!draft.title.trim()){fail('Donnez un titre à l’intervention.');return;}if(step===0&&draft.end<=draft.start){fail('La fin doit être après le début.');return;}if(step===1&&!draft.tasks.trim()){fail('Ajoutez au moins une tâche.');return;}if(step<2){step++;render(true);return;}const created={id:'INT-'+String(15+items.length-1).padStart(3,'0'),title:draft.title.trim(),room:draft.room,date:draft.date,start:draft.start,end:draft.end,state:'planned',agents:[],lead:'',tasks:draft.tasks.split('\n').filter(t=>t.trim()).map(t=>({name:t.trim(),done:false,before:false,after:false})),version:0,rework:[],reason:'',anomaly:'',closed:false,events:[]};items.unshift(created);event(created,'Intervention transmise au prestataire');selected=created.id;view='detail';notice='Intervention créée. Passez à la vue Responsable prestataire pour l’affecter.';}
if(f.id==='assignForm'){const agents=d.getAll('agents'),lead=d.get('lead');if(!agents.length||!agents.includes(lead)){fail('Sélectionnez au moins un agent et un responsable parmi les agents affectés.');return;}const overlaps=(a,b,c,d)=>a<d&&c<b;const conflict=agents.includes('Agent B')&&i.date==='2026-11-05'&&overlaps(i.start,i.end,'09:30','10:30')||items.some(x=>x!==i&&x.state!=='validated'&&x.date===i.date&&x.agents.some(a=>agents.includes(a))&&overlaps(i.start,i.end,x.start,x.end));if(conflict){fail('Un agent est déjà occupé sur ce créneau. Modifiez votre sélection.');return;}i.agents=agents;i.lead=lead;i.state='assigned';event(i,'Affectation à '+agents.join(', ')+' ; responsable : '+lead);notice='Affectation confirmée. La vue Agent responsable représente Agent A : affectez-le pour tester cette étape.';}
if(f.id==='reworkForm'){const tasks=d.getAll('tasks').map(Number);if(!tasks.length){fail('Sélectionnez au moins une tâche à reprendre.');return;}i.snapshots=i.snapshots||[];i.snapshots.push({version:i.version,tasks:structuredClone(i.tasks)});i.rework=tasks;i.reason=d.get('reason').trim();if(!i.reason){fail('Précisez le motif.');return;}tasks.forEach(k=>{i.tasks[k].done=false;i.tasks[k].after=false;});i.state='rework';event(i,'Reprise demandée : '+i.reason);notice='Reprise envoyée. Les autres tâches et la version précédente sont conservées.';}
if(f.id==='anomalyForm'){i.anomaly=d.get('anomaly').trim();i.closed=false;event(i,'Anomalie signalée : '+i.anomaly);notice='Anomalie enregistrée dans la simulation.';}
if(f.id==='validateForm'){i.state='validated';event(i,'Version '+i.version+' validée'+(d.get('reserve')?' avec réserve : '+d.get('reserve'):''));notice='Intervention validée par le client.';}
if(f.id==='closeForm'){i.closed=true;event(i,'Anomalie clôturée : '+d.get('resolution'));notice='Anomalie clôturée par le client.';}
dirty=false;render(true);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
